<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>report_found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!--    external css file-->
    <link rel="stylesheet" href="{{url_for('static',filename='css/nav.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/report_lost.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/foot.css') }}">
</head>
<body>
    {% include 'nav.html' %}
    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">

            <!-- Heading -->
            <h4 class="fw-bold">Report Found Item</h4>
            <p class="text-muted">
                Fill out the form below to report an item you've Found.This will help the owner locate their lost items.
            </p>

            <!-- Form Card -->
            <div class="form-card">
                <form action="/foundrepost" method="post">

                    <!-- Item Title -->
                    <label class="form-label">Item Title *</label>
                    <input class="form-control" type="text" placeholder="e.g. Black iPhone 14 Pro" name="item_name" required>

                    <!-- Description -->
                    <label class="form-label mt-3">Description *</label>
                    <textarea class="form-control" rows="3" name="description"
                        placeholder="Provide detailed description including color, brand, distinctive features, etc." required></textarea>

                    <!-- Category + Date -->
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">Category *</label>
                            <select class="form-select" name="category" required>
                                <option selected disabled>Select category</option>
                                <option value="electronics">Electronics</option>
                                <option value="Personal Items">Personal Items</option>
                                <option value="Bags & Luggage">Bags & Luggage</option>
                                <option value="Clothing & Accessories">Clothing & Accessories</option>
                                <option value="Books & Stationery">Books & Stationery</option>
                                <option value="Miscellaneous">Miscellaneous</option>
                                <option value="Vehicles & Parts">Vehicles & Parts</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Date Found *</label>
                            <input class="form-control" type="date" name="date" required>
                        </div>
                    </div>

                    <!-- Location -->
                    <label class="form-label mt-3">Location *</label>
                    <input class="form-control" type="text" placeholder="e.g. Main Library, 2nd Floor" name="location" required>

                    <!-- Contact -->
                    <label class="form-label mt-3">Contact Phone (Optional)</label>
                    <input class="form-control" type="tel" placeholder="+1234567890" name="contact" required>
                    <small class="text-muted">
                        Your email will be used as primary contact
                    </small>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" class="btn btn-dark w-75">Report Found Item</button>
                        <button type="reset" class="btn btn-light ms-2">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>
    {% include 'foot.html' %}
</body>
</html>
