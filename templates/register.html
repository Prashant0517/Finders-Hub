<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!--    external css file-->
    <link rel="stylesheet" href="{{url_for('static',filename='css/nav.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/register.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/foot.css') }}">
</head>
<body>
    {% include "nav.html" %}
    <main class="register-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <h2 class="text-center mb-4">Create Account</h2>
                    <form action="/formsave" method="post">
                        <input class="form-control mb-3" type="text" placeholder="Enter your full name" name="fullname">
                        <input class="form-control mb-3" type="email" placeholder="Enter mail id" name="mail">
                        <input class="form-control mb-3" type="password" placeholder="Enter password" name="pass">
                        <input class="form-control mb-3" type="tel" placeholder="Enter your contact" name="contact">
                        <textarea class="form-control mb-3" placeholder="Enter address" name="address"></textarea>
                        <button type="submit" class="btn btn-success w-100">
                            Register
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    {% include 'foot.html' %}
</body>
</html>
